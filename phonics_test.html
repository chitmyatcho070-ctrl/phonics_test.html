<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonics Level 1 - Letter Sound Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .quiz-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            font-size: 22px;
        }
        .speaker-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin: 20px 0;
            transition: 0.2s;
        }
        .speaker-btn:hover {
            background-color: #45a049;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }
        .option-btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 20px;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-btn:hover {
            background-color: #0b7dda;
        }
        #result {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            color: #333;
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <h1>Phonics Sound Test (Level 1)</h1>
    <p>အသံကို နားထောင်ပြီး မှန်ကန်သော စာလုံးကို ရွေးပါ</p>
    
    <button class="speaker-btn" onclick="playSound()">🔊 Sound ကို နားထောင်ရန်</button>

    <div class="options-grid" id="options">
        <!-- Buttons will be generated by JavaScript -->
    </div>

    <div id="result"></div>
</div>

<script>
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    let currentTarget = '';
    let score = 0;
    let questionCount = 0;
    const maxQuestions = 10;

    function playSound() {
        if (!currentTarget) return;
        // Text-to-Speech သုံး၍ Phonics sound ထွက်စေရန်
        const utterance = new SpeechSynthesisUtterance(currentTarget.toLowerCase());
        utterance.lang = 'en-US';
        utterance.rate = 0.7; // အသံကို ပိုမို ဖြည်းဖြည်းနှင့် ရှင်းရှင်းထွက်စေရန်
        window.speechSynthesis.speak(utterance);
    }

    function generateQuestion() {
        if (questionCount >= maxQuestions) {
            document.querySelector('.quiz-card').innerHTML = `
                <h2>Test ပြီးဆုံးပါပြီ! 🎉</h2>
                <p>သင့်ရမှတ်: <b>${score} / ${maxQuestions}</b></p>
                <button class="speaker-btn" onclick="location.reload()">ပြန်လည်စစ်ဆေးရန်</button>
            `;
            return;
        }

        questionCount++;
        const randomIndex = Math.floor(Math.random() * letters.length);
        currentTarget = letters[randomIndex];

        // မတူညီသော စာလုံး ရွေးချယ်စရာ ၄ ခု စီစဉ်ခြင်း
        let choices = [currentTarget];
        while (choices.length < 4) {
            let randomChar = letters[Math.floor(Math.random() * letters.length)];
            if (!choices.includes(randomChar)) {
                choices.push(randomChar);
            }
        }
        choices.sort(() => Math.random() - 0.5);

        // UI ကို Update လုပ်ခြင်း
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        choices.forEach(letter => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = letter;
            btn.onclick = () => checkAnswer(letter);
            optionsDiv.appendChild(btn);
        });

        // မေးခွန်းအသစ်စတိုင်း အသံ အလိုအလျောက် ထွက်စေခြင်း
        setTimeout(playSound, 300);
    }

    function checkAnswer(selected) {
        if (selected === currentTarget) {
            score++;
            alert("မှန်ကန်ပါတယ်! 👏");
        } else {
            alert(`မှားယွင်းပါသည်။ အမှန်မှာ '${currentTarget}' ဖြစ်ပါသည်။`);
        }
        generateQuestion();
    }

    // မေးခွန်းစတင်ရန်
    generateQuestion();
</script>

</body>
</html>
